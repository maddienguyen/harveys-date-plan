  <path d="M78 64 C84 56, 100 56, 106 64 C98 62, 86 62, 78 64 Z" fill="#fcc419" stroke="#1b1108" stroke-width="3" stroke-linejoin="round" />
  <path d="M80 65 L92 82 L104 65 C98 76, 86 76, 80 65 Z" fill="#f59f00" stroke="#1b1108" stroke-width="3" stroke-linejoin="round" />

