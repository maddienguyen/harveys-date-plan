<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="320" height="280" role="img" aria-label="Cozy cartoon chicken wearing oversized glasses under a blanket snacking on fries while watching YouTube and WandaVision on a retro TV">
  <!-- Ground shadow -->
  <ellipse cx="160" cy="256" rx="134" ry="12" fill="#1b1108" fill-opacity="0.14" />

  <!-- Cozy sparkles and floating TV glow rays -->
  <path d="M188 144 L172 134 M192 162 L174 160 M196 126 L182 114" fill="none" stroke="#ffd43b" stroke-width="3" stroke-linecap="round" />
  <path d="M44 64 L48 72 L56 76 L48 80 L44 88 L40 80 L32 76 L40 72 Z" fill="#ffd43b" stroke="#1b1108" stroke-width="2.5" stroke-linejoin="round" />
  <path d="M196 52 C200 44, 212 46, 210 56 C208 62, 198 66, 194 70 C190 66, 180 62, 178 56 C176 46, 188 44, 196 52 Z" fill="#ff4d4d" stroke="#1b1108" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Plush Couch Back & Feet -->
  <rect x="40" y="238" width="14" height="16" rx="4" fill="#d9480f" stroke="#1b1108" stroke-width="3" />
  <rect x="176" y="238" width="14" height="16" rx="4" fill="#d9480f" stroke="#1b1108" stroke-width="3" />
  <path d="M36 126 C36 108, 56 102, 114 102 C172 102, 192 108, 192 126 L192 216 L36 216 Z" fill="#7048e8" stroke="#1b1108" stroke-width="4" stroke-linejoin="round" />
  <path d="M46 124 C56 112, 84 110, 114 110 C144 110, 172 112, 182 124" fill="none" stroke="#9775fa" stroke-width="5" stroke-linecap="round" />

  <!-- Chicken Head & Cozy Floppy Comb -->
  <path d="M84 96 C78 68, 94 48, 118 48 C142 48, 158 66, 156 94 C156 118, 140 132, 118 132 C96 132, 84 118, 84 96 Z" fill="#fff9ef" stroke="#1b1108" stroke-width="4" stroke-linejoin="round" />
  <path d="M98 54 C92 40, 104 30, 116 40 C122 28, 136 32, 134 46 C144 42, 150 52, 140 58 Z" fill="#ff3b30" stroke="#1b1108" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Happy eyes behind oversized glasses -->
  <circle cx="106" cy="84" r="15" fill="#e6fcf5" stroke="#1b1108" stroke-width="4" />
  <circle cx="140" cy="84" r="15" fill="#e6fcf5" stroke="#1b1108" stroke-width="4" />
  <path d="M121 84 C123 80, 125 80, 125 84" fill="none" stroke="#1b1108" stroke-width="4" stroke-linecap="round" />
  <path d="M88 82 L91 82 M155 82 L160 82" fill="none" stroke="#1b1108" stroke-width="3.5" stroke-linecap="round" />
  <!-- Happy dilated pupils looking toward the TV -->
  <circle cx="109" cy="85" r="5" fill="#1b1108" />
  <circle cx="143" cy="85" r="5" fill="#1b1108" />
  <circle cx="111" cy="83" r="2" fill="#ffffff" />
  <circle cx="145" cy="83" r="2" fill="#ffffff" />
  <!-- Glasses shine -->
  <path d="M96 78 L104 72 M130 78 L138 72" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

  <!-- Rosy cheek & happy beak munching a fry -->
  <ellipse cx="93" cy="100" rx="6.5" ry="4" fill="#ff8787" opacity="0.7" />
  <path d="M116 112 C112 122, 118 128, 124 124 C128 120, 128 114, 124 110" fill="#ff3b30" stroke="#1b1108" stroke-width="3" />
  <path d="M120 98 C134 94, 150 98, 154 105 C146 112, 130 112, 120 107 Z" fill="#fcc419" stroke="#1b1108" stroke-width="3.5" stroke-linejoin="round" />
  <path d="M124 108 C134 114, 146 113, 150 107" fill="#f59f00" stroke="#1b1108" stroke-width="3" stroke-linejoin="round" />
  <!-- Golden fry sticking out of happy beak -->
  <rect x="142" y="102" width="18" height="6" rx="2.5" transform="rotate(-14 142 102)" fill="#ffd43b" stroke="#1b1108" stroke-width="2.5" />

  <!-- Cozy Blanket draped around shoulders & lap -->
  <path d="M68 134 C82 118, 146 118, 160 134 C172 152, 174 196, 162 216 L66 216 C56 196, 56 154, 68 134 Z" fill="#ff922b" stroke="#1b1108" stroke-width="4" stroke-linejoin="round" />
  <!-- Blanket stripes & cozy folds -->
  <path d="M64 166 C94 176, 134 176, 168 166" fill="none" stroke="#ffd43b" stroke-width="6" stroke-linecap="round" />
  <path d="M64 192 C94 202, 134 202, 166 192" fill="none" stroke="#fff9ef" stroke-width="5" stroke-linecap="round" />
  <path d="M64 166 C94 176, 134 176, 168 166" fill="none" stroke="#1b1108" stroke-width="2" stroke-dasharray="6 6" stroke-linecap="round" />

  <!-- Harvey's-style Red Fry Carton & Golden Fries -->
  <g transform="rotate(-8 158 168)">
    <rect x="144" y="128" width="7" height="28" rx="3" transform="rotate(-14 144 128)" fill="#ffd43b" stroke="#1b1108" stroke-width="2.5" />
    <rect x="152" y="122" width="7" height="32" rx="3" transform="rotate(-4 152 122)" fill="#fcc419" stroke="#1b1108" stroke-width="2.5" />
    <rect x="160" y="124" width="7" height="30" rx="3" transform="rotate(8 160 124)" fill="#ffd43b" stroke="#1b1108" stroke-width="2.5" />
    <rect x="167" y="130" width="7" height="26" rx="3" transform="rotate(18 167 130)" fill="#f59f00" stroke="#1b1108" stroke-width="2.5" />
    <path d="M138 148 C150 156, 166 156, 178 148 L172 188 C164 192, 152 192, 144 188 Z" fill="#e03131" stroke="#1b1108" stroke-width="3.5" stroke-linejoin="round" />
    <circle cx="158" cy="170" r="6" fill="#fff9ef" />
  </g>
  <!-- Wing hugging fry carton -->
  <path d="M130 156 C138 164, 146 174, 154 176 C160 178, 164 170, 158 164" fill="#fff9ef" stroke="#1b1108" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Couch Front Cushion & Armrests (foreground framing) -->
  <path d="M22 162 C22 146, 52 146, 54 166 L54 238 L24 238 Z" fill="#5f3dc4" stroke="#1b1108" stroke-width="4" stroke-linejoin="round" />
  <path d="M174 166 C176 146, 206 146, 206 162 L204 238 L174 238 Z" fill="#5f3dc4" stroke="#1b1108" stroke-width="4" stroke-linejoin="round" />
  <rect x="52" y="210" width="124" height="28" rx="8" fill="#5f3dc4" stroke="#1b1108" stroke-width="4" />

  <!-- Retro WandaVision + YouTube TV (bottom right) -->
  <!-- Rabbit-ear antennas -->
  <line x1="252" y1="154" x2="232" y2="112" stroke="#1b1108" stroke-width="4" stroke-linecap="round" />
  <line x1="258" y1="154" x2="282" y2="108" stroke="#1b1108" stroke-width="4" stroke-linecap="round" />
  <circle cx="232" cy="112" r="5" fill="#ff3b30" stroke="#1b1108" stroke-width="2.5" />
  <circle cx="282" cy="108" r="5" fill="#20c997" stroke="#1b1108" stroke-width="2.5" />

  <!-- TV Cabinet -->
  <rect x="200" y="152" width="104" height="92" rx="16" fill="#e85d04" stroke="#1b1108" stroke-width="4" />
  <rect x="210" y="244" width="12" height="10" rx="3" fill="#1b1108" />
  <rect x="282" y="244" width="12" height="10" rx="3" fill="#1b1108" />
  <!-- TV Screen -->
  <rect x="210" y="164" width="66" height="68" rx="12" fill="#1e293b" stroke="#1b1108" stroke-width="3.5" />
  <!-- WandaVision retro crimson/teal hex glow + YouTube play button -->
  <polygon points="243,172 266,185 266,211 243,224 220,211 220,185" fill="#20c997" fill-opacity="0.28" stroke="#66d9e8" stroke-width="2" />
  <rect x="225" y="185" width="36" height="26" rx="7" fill="#ff3b30" stroke="#1b1108" stroke-width="2.5" />
  <polygon points="239,192 251,198 239,204" fill="#fff9ef" />
  <!-- Screen glass shine -->
  <path d="M218 174 L228 170" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
  <!-- Retro Tuner Dials -->
  <circle cx="290" cy="178" r="8" fill="#ffd43b" stroke="#1b1108" stroke-width="3" />
  <line x1="290" y1="178" x2="294" y2="173" stroke="#1b1108" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="290" cy="202" r="8" fill="#fff9ef" stroke="#1b1108" stroke-width="3" />
  <line x1="290" y1="202" x2="286" y2="198" stroke="#1b1108" stroke-width="2.5" stroke-linecap="round" />
  <!-- Speaker grille slits -->
  <line x1="283" y1="218" x2="297" y2="218" stroke="#1b1108" stroke-width="3" stroke-linecap="round" />
  <line x1="283" y1="225" x2="297" y2="225" stroke="#1b1108" stroke-width="3" stroke-linecap="round" />
</svg>
