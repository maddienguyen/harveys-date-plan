<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180" role="img" aria-label="Playful winking cartoon chicken peeking from the right holding a golden fry">
  <!-- Sparkles -->
  <path d="M32 34 L36 42 L44 46 L36 50 L32 58 L28 50 L20 46 L28 42 Z" fill="#ffd43b" stroke="#1b1108" stroke-width="2.5" stroke-linejoin="round" />
  <circle cx="24" cy="96" r="4.5" fill="#ff7b00" stroke="#1b1108" stroke-width="2" />

  <!-- Rounded peeking body & head on right side facing left -->
  <path d="M156 50 C166 72, 166 134, 154 154 C132 164, 92 162, 76 142 C62 126, 58 104, 60 82 C62 52, 84 34, 112 34 C136 34, 150 40, 156 50 Z" fill="#fff9ef" stroke="#1b1108" stroke-width="4" stroke-linejoin="round" />
  <path d="M94 148 C78 136, 64 114, 64 86 C64 66, 76 48, 92 40 C72 46, 60 66, 60 90 C60 118, 76 142, 94 148 Z" fill="#f3d9b1" />

  <!-- Cute orange Harvey's mini-cap tilted jauntily + comb -->
  <path d="M108 38 C114 22, 130 20, 136 34 C144 26, 154 34, 146 46 Z" fill="#ff3b30" stroke="#1b1108" stroke-width="3.5" stroke-linejoin="round" />
  <path d="M78 52 C82 32, 102 24, 120 30 C134 34, 140 46, 136 56 Z" fill="#e85d04" stroke="#1b1108" stroke-width="3.5" stroke-linejoin="round" />
  <path d="M62 56 C76 48, 98 48, 114 56 C100 60, 76 60, 62 56 Z" fill="#d9480f" stroke="#1b1108" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Winking expression: left eye shiny wide, right eye cheerful wink arc -->
  <ellipse cx="77" cy="77" rx="9.5" ry="11.5" fill="#ffffff" stroke="#1b1108" stroke-width="3" />
  <circle cx="74" cy="77" r="4.8" fill="#1b1108" />
  <circle cx="72" cy="74" r="2" fill="#ffffff" />
  <path d="M96 78 C102 70, 112 70, 116 78" fill="none" stroke="#1b1108" stroke-width="4" stroke-linecap="round" />

  <!-- Rosy cheek & wattle -->
  <ellipse cx="122" cy="94" rx="7" ry="4.5" fill="#ff8787" opacity="0.7" />
  <path d="M84 104 C80 114, 84 122, 91 121 C97 120, 98 110, 95 104" fill="#ff3b30" stroke="#1b1108" stroke-width="3" stroke-linejoin="round" />

  <!-- Cheeky smiling beak facing left -->
