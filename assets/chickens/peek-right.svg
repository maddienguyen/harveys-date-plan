  <path d="M48 122 C36 122, 28 128, 30 138 C32 146, 44 148, 52 140 C58 148, 70 144, 70 134 C70 124, 58 120, 48 122 Z" fill="#fff9ef" stroke="#1b1108" stroke-width="3.5" stroke-linejoin="round" />
</svg>
